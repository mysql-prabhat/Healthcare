apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: healthcare-ingress

spec:

  ingressClassName: alb

  rules:

  - host: api.company.com

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:
            name: backend-service

            port:
              number: 80